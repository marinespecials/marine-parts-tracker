<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Marine Specials</title>
    <style>
        :root { --primary:#0F172A; --accent:#2563EB; --danger:#DC2626; --border:#E2E8F0; --muted:#64748B; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
               font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(160deg,#0F172A,#1E3A8A); }
        .box { background:#fff; width:100%; max-width:380px; border-radius:14px; padding:34px 30px; box-shadow:0 20px 50px rgba(0,0,0,.35); }
        h1 { margin:0 0 4px; font-size:1.3rem; color:var(--primary); }
        p.sub { margin:0 0 22px; color:var(--muted); font-size:.9rem; }
        label { display:block; font-size:.78rem; font-weight:700; color:#334155; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.5px; }
        input { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; font-size:1rem; }
        input:focus { outline:2px solid var(--accent); outline-offset:1px; }
        button { width:100%; margin-top:22px; padding:12px; background:var(--accent); color:#fff; border:0; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; }
        button:hover { background:#1D4ED8; }
        .err { background:#FEF2F2; color:var(--danger); border:1px solid #FECACA; border-radius:8px; padding:10px 12px; font-size:.85rem; margin-bottom:6px; }
    </style>
</head>
<body>
    <form class="box" method="post" autocomplete="on">
        {% csrf_token %}
        <h1>⚓ Marine Specials</h1>
        <p class="sub">Sign in to continue</p>
        {% if form.errors %}<div class="err">Wrong username or password.</div>{% endif %}
        <label for="id_username">Username</label>
        <input id="id_username" name="username" type="text" autocomplete="username" autofocus required>
        <label for="id_password">Password</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
