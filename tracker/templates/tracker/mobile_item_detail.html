<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanned Part: {{ item.name }}</title>
    <style>
        :root { --marine-blue: #0A2540; --steel-gray: #F3F4F6; --accent-green: #10B981; --text-dark: #1F2937; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--steel-gray); margin: 0; color: var(--text-dark); padding: 15px; }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; margin-top: 10px; }
        .part-title { font-size: 1.8rem; color: var(--marine-blue); margin-bottom: 5px; margin-top: 0; }
        .location-badge { display: inline-block; background-color: #E0E7FF; color: #4338CA; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 20px; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; text-align: left; }
        .info-box { background: #F9FAFB; padding: 15px; border-radius: 8px; border: 1px solid #E5E7EB; }
        .info-label { font-size: 0.8rem; color: #6B7280; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .info-value { font-size: 1.1rem; font-weight: bold; color: var(--text-dark); }
        
        .status-badge { display: inline-block; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 1rem; width: 100%; box-sizing: border-box; text-align: center; }
        .status-delivered { background-color: #D1FAE5; color: #065F46; }
        .status-pending { background-color: #FEF3C7; color: #92400E; }
        
        .action-btn { width: 100%; padding: 16px; border-radius: 8px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 15px; }
        .btn-toggle { background-color: var(--marine-blue); color: white; }
        .btn-toggle:hover { background-color: #11375C; }
        
        .qty-form { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .qty-input { width: 80px; padding: 10px; border: 2px solid #D1D5DB; border-radius: 8px; font-size: 1.2rem; font-weight: bold; text-align: center; }
        .btn-save { background-color: var(--accent-green); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>

    <a href="{% url 'item_list' %}" style="color: var(--marine-blue); text-decoration: none; font-weight: bold; font-size: 1.1rem;">&larr; Back to Master List</a>

    <div class="card">
        <h1 class="part-title">{{ item.name }}</h1>
        <div class="location-badge">📍 {{ item.compartment.name|upper }}</div>

        <div class="info-grid">
            <div class="info-box">
                <div class="info-label">Assigned Order</div>
                <div class="info-value">{{ item.offer.title|default:"Warehouse Storage" }}</div>
            </div>
            <div class="info-box">
                <div class="info-label">Current Status</div>
                {% if item.is_delivered %}
                    <div class="status-badge status-delivered">Delivered</div>
                {% else %}
                    <div class="status-badge status-pending">Pending</div>
                {% endif %}
            </div>
        </div>

        <div class="info-label" style="text-align: center;">Update Quantity</div>
        <form action="{% url 'update_item_quantity' item.id %}" method="POST" class="qty-form">
            {% csrf_token %}
            <input type="number" name="quantity" value="{{ item.quantity }}" min="0" class="qty-input">
            <button type="submit" class="btn-save">Save Qty</button>
        </form>

        <form method="POST" action="{% url 'toggle_item' item.id %}">
            {% csrf_token %}
            <button type="submit" class="action-btn btn-toggle">
                {% if item.is_delivered %}❌ Mark as Pending{% else %}✅ Mark as Delivered{% endif %}
            </button>
        </form>
    </div>

</body>
</html>
