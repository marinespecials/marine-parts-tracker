{% extends 'base.html' %}{% load ui %}
{% block title %}Edit {{ item.part_name }}{% endblock %}

{% block content %}
<div class="crumbs">
    <a href="{% url 'inventory_list' %}">Warehouse</a>{% icon "chevron-right" %}
    <a href="{% url 'part_detail' item.id %}">{{ item.part_name }}</a>{% icon "chevron-right" %}<span>Edit</span>
</div>
<div class="page-header"><div><h1>Edit part</h1></div></div>

<form method="POST" class="card" style="max-width:820px">
    {% csrf_token %}
    <div class="card-body">
        <div class="form-grid">
            <div class="field span-all"><label for="part_name">Part name *</label><input type="text" id="part_name" name="part_name" value="{{ item.part_name }}" required></div>
            <div class="field"><label for="part_code">OEM / part code</label><input type="text" id="part_code" name="part_code" value="{{ item.part_code|default:'' }}"></div>
            <div class="field">
                <label for="category">Category</label>
                <select id="category" name="category">
                    {% for code, label in categories %}<option value="{{ code }}" {% if item.category == code %}selected{% endif %}>{{ label }}</option>{% endfor %}
                </select>
            </div>
            <div class="field"><label for="location">Location / bin</label><input type="text" id="location" name="location" value="{{ item.location }}"></div>
            <div class="field"><label for="quantity">In stock</label><input type="number" id="quantity" name="quantity" value="{{ item.quantity }}" min="0" required></div>
            <div class="field"><label for="reorder_level">Reorder at</label><input type="number" id="reorder_level" name="reorder_level" value="{{ item.reorder_level }}" min="0"><span class="hint">Shows as low stock at or below this number.</span></div>
            <div class="field"><label for="unit_cost">Unit cost €</label><input type="number" step="0.01" min="0" id="unit_cost" name="unit_cost" value="{{ item.unit_cost }}"></div>
        </div>
    </div>
    <div class="card-footer">
        <a href="{% url 'part_detail' item.id %}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">{% icon "check" %}Save changes</button>
    </div>
</form>
{% endblock %}
