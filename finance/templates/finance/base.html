<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Marine Specials Portal{% endblock %}</title>
    <style>
        :root {
            --primary: #0F172A;
            --accent: #2563EB;
            --accent-light: #EFF6FF;
            --surface: #FFFFFF;
            --bg: #F8FAFC;
            --border: #E2E8F0;
            --text-secondary: #64748B;
            --danger: #DC2626;
            --success: #059669;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
        }

        /* STICKY TOP NAVIGATION BAR */
        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        /* CLICKABLE LOGO BRANDING */
        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 800;
            font-size: 1.15rem;
            transition: opacity 0.15s ease;
        }

        .brand-logo:hover {
            opacity: 0.8;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.875rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .nav-link:hover {
            color: var(--accent);
            background-color: var(--accent-light);
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-bar input {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.825rem;
            width: 180px;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* LAYOUT & CONTAINERS */
        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0;
        }

        /* BUTTON STYLES */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #1D4ED8; }

        .btn-outline { background: white; border-color: var(--border); color: var(--primary); }
        .btn-outline:hover { background: #F1F5F9; }

        .card {
            background: var(--surface);
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 20px;
            margin-bottom: 20px;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

<!-- TOP NAVIGATION -->
<nav class="navbar">
    <!-- CLICKABLE LOGO -> NAVIGATES TO MAIN HUB -->
    <a href="{% url 'hub' %}" class="brand-logo" title="Back to Main Portal Hub">
        🚢 <span>Marine Specials</span>
    </a>

    <!-- MAIN APP NAVIGATION -->
    <div class="nav-links">
        <a href="{% url 'hub' %}" class="nav-link">📊 Hub</a>
        <a href="{% url 'orders_dashboard' %}" class="nav-link">📦 Orders</a>
        <a href="{% url 'inventory_list' %}" class="nav-link">🏭 Warehouse</a>
        <a href="{% url 'research_hub' %}" class="nav-link">🔬 Research</a>
        <a href="{% url 'active_board' %}" class="nav-link">⚡ Live Board</a>
        <a href="{% url 'client_pricelist' %}" class="nav-link">📋 Catalog</a>
        <a href="{% url 'client_list' %}" class="nav-link">👥 Clients</a>
    </div>

    <!-- GLOBAL SEARCH -->
    <form method="GET" action="{% url 'global_search' %}" class="search-bar">
        <input type="text" name="q" placeholder="Global Search..." required>
        <button type="submit" class="btn btn-outline" style="padding: 5px 10px; font-size: 0.8rem;">Search</button>
    </form>
</nav>

<!-- MAIN CONTENT BLOCK -->
<main class="container">
    <div class="page-header">
        <h1 class="page-title">{% block page_title %}Marine Specials Portal{% endblock %}</h1>
        <div>
            {% block topbar_actions %}{% endblock %}
        </div>
    </div>

    {% block content %}{% endblock %}
</main>

</body>
</html>
